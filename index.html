<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E.A.C. Insurance Agencies &amp; Consultants Ltd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
    --bg:#ffffff;
    --text:#1a1a2e;
    --gold:#BC9042;
    --tagline:#6a6a6a;
}
@media(prefers-color-scheme:dark){
    :root{
        --bg:#0a1929;
        --text:#f0ece4;
        --tagline:#cdd4dd;
    }
}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{
    font-family:'Montserrat',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    cursor:pointer;
}

.stage{
    position:fixed;
    inset:0;
    display:grid;
    place-items:center;
}

/* ── Phase 1: Editorial Statement ─────────── */
.statement{
    grid-area:1/1;
    text-align:center;
    padding:0 2rem;
    max-width:800px;
    z-index:2;
    animation:flipOut .7s 1.9s cubic-bezier(.4,0,.15,1) forwards;
}

.statement .line{
    font-family:'Playfair Display',Georgia,serif;
    font-weight:700;
    font-size:clamp(34px,6.5vw,66px);
    line-height:1.25;
    color:var(--text);
    letter-spacing:-.01em;
}

.statement .line-2{
    font-style:italic;
    color:var(--gold);
    margin-top:.1em;
}

.word{
    display:inline-block;
    opacity:0;
    transform:translateY(14px);
    animation:wordIn .4s ease-out forwards;
}

@keyframes wordIn{to{opacity:1;transform:translateY(0);}}

@keyframes flipOut{
    0%  {opacity:1;transform:perspective(1200px) rotateY(0) scale(1);}
    55% {opacity:0;}
    100%{opacity:0;transform:perspective(1200px) rotateY(55deg) scale(.94);}
}

/* ── Phase 2: Logo Composition (same as before) ── */
.composition{
    grid-area:1/1;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:clamp(40px,9vmin,76px) clamp(52px,13vmin,116px);
    opacity:0;
    animation:flipIn .7s 2.0s cubic-bezier(.22,.6,.2,1) forwards,
              compOut .5s 4.4s ease-in forwards;
}

@keyframes flipIn{
    0%  {opacity:0;transform:perspective(1200px) rotateY(-55deg) scale(.94);}
    45% {opacity:1;}
    100%{opacity:1;transform:perspective(1200px) rotateY(0) scale(1);}
}
@keyframes compOut{to{opacity:0;}}

/* Gold frame — four edges trace clockwise */
.frame{position:absolute;inset:0;}
.frame .edge{position:absolute;background:var(--gold);}
.frame .edge.top   {top:0;left:0;right:0;height:1.5px;transform:scaleX(0);transform-origin:left;  animation:growX .22s 2.7s cubic-bezier(.3,.5,.2,1) forwards;}
.frame .edge.right {top:0;bottom:0;right:0;width:1.5px;transform:scaleY(0);transform-origin:top;   animation:growY .22s 2.9s cubic-bezier(.3,.5,.2,1) forwards;}
.frame .edge.bottom{bottom:0;left:0;right:0;height:1.5px;transform:scaleX(0);transform-origin:right;animation:growX .22s 3.1s cubic-bezier(.3,.5,.2,1) forwards;}
.frame .edge.left  {top:0;bottom:0;left:0;width:1.5px;transform:scaleY(0);transform-origin:bottom;animation:growY .22s 3.3s cubic-bezier(.3,.5,.2,1) forwards;}

@keyframes growX{to{transform:scaleX(1);}}
@keyframes growY{to{transform:scaleY(1);}}

.logo{
    width:clamp(140px,30vmin,280px);
    height:auto;
    display:block;
    mix-blend-mode:multiply;
}

.tagline{
    margin-top:clamp(20px,4vmin,34px);
    font-weight:600;
    font-size:clamp(11px,2vw,14px);
    text-transform:uppercase;
    color:var(--tagline);
    letter-spacing:.08em;
    opacity:0;
    transform:translateY(5px);
    white-space:nowrap;
    animation:taglineIn .45s 3.0s cubic-bezier(.22,.6,.2,1) forwards;
}
@keyframes taglineIn{to{opacity:1;transform:translateY(0);letter-spacing:.2em;}}

@media(prefers-color-scheme:dark){
    .logo{mix-blend-mode:screen;content:url('assets/img/logo-dark.png');}
}

@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important;}
}
</style>
</head>
<body>
<div class="stage">
    <div class="statement">
        <div class="line" id="line1"></div>
        <div class="line line-2" id="line2"></div>
    </div>

    <div class="composition">
        <div class="frame">
            <span class="edge top"></span>
            <span class="edge right"></span>
            <span class="edge bottom"></span>
            <span class="edge left"></span>
        </div>
        <img class="logo" src="assets/img/logo_gray.png" alt="E.A.C. Insurance Agencies &amp; Consultants Ltd">
        <div class="tagline">Different Because We Care</div>
    </div>
</div>

<script>
(function(){
    var NEXT='main.html';
    var done=false;
    function go(){if(done)return;done=true;window.location.replace(NEXT);}

    if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){go();return;}

    document.addEventListener('keydown',function(e){if(e.key==='Escape')go();});
    document.addEventListener('click',go);

    var w1=['We','don\'t','sell','policies.'];
    var w2=['We','earn','trust.'];
    var l1=document.getElementById('line1');
    var l2=document.getElementById('line2');
    var d=250;

    w1.forEach(function(w,i){
        var s=document.createElement('span');
        s.className='word';s.textContent=w+' ';
        s.style.animationDelay=(d+i*150)+'ms';
        l1.appendChild(s);
    });
    w2.forEach(function(w,i){
        var s=document.createElement('span');
        s.className='word';s.textContent=w+' ';
        s.style.animationDelay=(d+(w1.length+i)*150)+'ms';
        l2.appendChild(s);
    });

    setTimeout(go,5000);
})();
</script>
</body>
</html>
